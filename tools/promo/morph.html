<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>CAD shape morph render source</title>
<style>
  html, body { margin: 0; background: #0b1020; }
  canvas { display: block; }
</style>
<canvas width="1080" height="420"></canvas>
<script>
const canvas = document.querySelector('canvas');
const gl = canvas.getContext('webgl2', { preserveDrawingBuffer: true });
if (!gl) throw new Error('WebGL2 is required to render the promo');

const vertexSource = `#version 300 es
in vec2 position;
void main() { gl_Position = vec4(position, 0., 1.); }`;

const fragmentSource = `#version 300 es
precision highp float;
uniform vec2 resolution;
uniform float time;
out vec4 color;

const float PI = 3.14159265359;

float phase(float a, float b) {
  float t = clamp((time - a) / (b - a), 0., 1.);
  return t * t * (3. - 2. * t);
}

vec3 turn(vec3 p) {
  float a = PI * time / 12.;
  float c = cos(a), s = sin(a);
  p.xy = mat2(c, -s, s, c) * p.xy;
  return p;
}

float box(vec3 p, vec3 b) {
  vec3 q = abs(p) - b;
  return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.);
}

float chamferedBox(vec3 p, vec3 b, float r) {
  vec3 q = abs(p);
  float d = box(p, b);
  d = max(d, (q.x + q.y - b.x - b.y + r) * .70710678);
  d = max(d, (q.x + q.z - b.x - b.z + r) * .70710678);
  d = max(d, (q.y + q.z - b.y - b.z + r) * .70710678);
  return d;
}

float roundedBox(vec3 p, vec3 b, float r) {
  return box(p, b - vec3(r)) - r;
}

float cylinder(vec3 p, float r, float h) {
  return max(length(p.xy) - r, abs(p.z) - h);
}

float hexagon(vec2 p, float r) {
  const vec3 k = vec3(-.8660254, .5, .5773503);
  p = abs(p);
  p -= 2. * min(dot(k.xy, p), 0.) * k.xy;
  p -= vec2(clamp(p.x, -k.z * r, k.z * r), r);
  return length(p) * sign(p.y);
}

float blockMorph(vec3 p) {
  vec3 size = mix(vec3(.72), vec3(.94, .64, .75), phase(.4, 1.8));
  float d = chamferedBox(p, size, .22 * phase(2., 3.2));
  d = mix(d, roundedBox(p, size, .36), phase(3.4, 4.6));
  d = mix(d, length(p) - .87, phase(4.8, 6.1));
  d = max(d, .33 * phase(6.3, 7.7) - length(p.xy));
  float torus = length(vec2(length(p.xy) - .55, p.z)) - .36;
  d = mix(d, torus, phase(8., 9.3));
  return mix(d, box(p, vec3(.72)), phase(10., 11.7));
}

float vesselMorph(vec3 p) {
  float d = cylinder(p, .72, .72);
  float taper = max(length(p.xy) - (.72 - .35 * p.z), abs(p.z) - .72);
  d = mix(d, taper, phase(1., 2.7));
  float waist = max(length(p.xy) - (.74 - .19 * exp(-7. * p.z * p.z)), abs(p.z) - .72);
  d = mix(d, waist, phase(3., 4.5));
  vec3 center = vec3(0., 0., clamp(p.z, -.48, .48));
  float capsule = length(p - center) - .6;
  d = mix(d, capsule, phase(4.8, 6.1));
  d = max(d, .3 * phase(6.3, 7.7) - length(p.xy));
  float pipe = max(cylinder(p, .73, .72), .32 - length(p.xy));
  d = mix(d, pipe, phase(8., 9.4));
  return mix(d, cylinder(p, .72, .72), phase(10., 11.7));
}

float wheelMorph(vec3 p) {
  float prism = max(hexagon(p.xy, .78), abs(p.z) - .42);
  float a = atan(p.y, p.x);
  float gear = max(length(p.xy) - (.7 + .12 * cos(12. * a)), abs(p.z) - .35);
  float d = mix(prism, gear, phase(1.8, 4.));
  d = max(d, .29 * phase(4.4, 6.2) - length(p.xy));
  float ring = max(cylinder(p, .83, .28), .32 - length(p.xy));
  d = mix(d, ring, phase(7., 8.8));
  return mix(d, prism, phase(10., 11.7));
}

float shape(vec3 p, int model) {
  p = turn(p);
  if (model == 0) return blockMorph(p);
  if (model == 1) return vesselMorph(p);
  return wheelMorph(p);
}

vec3 normalAt(vec3 p, int model) {
  const vec2 e = vec2(.001, 0.);
  return normalize(vec3(
    shape(p + e.xyy, model) - shape(p - e.xyy, model),
    shape(p + e.yxy, model) - shape(p - e.yxy, model),
    shape(p + e.yyx, model) - shape(p - e.yyx, model)));
}

float shadow(vec3 p, vec3 light, int model) {
  float t = .02, shade = 1.;
  for (int i = 0; i < 24; i++) {
    float h = shape(p + light * t, model);
    shade = min(shade, 14. * h / t);
    t += clamp(h, .025, .16);
    if (h < .001 || t > 4.) break;
  }
  return clamp(shade, .25, 1.);
}

void main() {
  float cell = resolution.x / 3.;
  int model = int(floor(gl_FragCoord.x / cell));
  float x = mod(gl_FragCoord.x, cell);
  vec2 uv = (vec2(x - cell * .5, gl_FragCoord.y - resolution.y * .5)) / resolution.y;
  vec3 eye = vec3(2.6, -3.7, 2.4);
  vec3 forward = normalize(-eye);
  vec3 right = normalize(cross(forward, vec3(0., 0., 1.)));
  vec3 up = cross(right, forward);
  vec3 ray = normalize(forward * 1.55 + uv.x * right + uv.y * up);
  vec3 palette = model == 0 ? vec3(.08, .70, .84) :
    model == 1 ? vec3(.94, .32, .31) : vec3(.88, .58, .16);
  vec3 bg = mix(vec3(.035, .055, .11), vec3(.074, .11, .19), clamp(uv.y + .5, 0., 1.));
  bg += palette * .025 * exp(-5. * dot(uv, uv));
  float distance = 0.;
  for (int i = 0; i < 100; i++) {
    vec3 p = eye + ray * distance;
    float d = shape(p, model);
    if (d < .0015) {
      vec3 n = normalAt(p, model);
      vec3 light = normalize(vec3(-.65, -.35, 1.));
      float diffuse = max(dot(n, light), 0.);
      float rim = pow(1. - max(dot(n, -ray), 0.), 2.4);
      float spec = pow(max(dot(reflect(-light, n), -ray), 0.), 34.);
      vec3 local = turn(p);
      float angle = atan(local.y, local.x);
      float band = .93 + .07 * cos(4. * angle);
      float seam = 1. - smoothstep(.02, .07, abs(sin(angle)));
      seam *= 1. - smoothstep(.45, .85, abs(n.z));
      bg = palette * band * (.27 + diffuse * .74 * shadow(p + n * .008, light, model));
      bg *= 1. - .2 * seam;
      bg += palette * rim * .38 + vec3(1.) * spec * .32;
      break;
    }
    distance += max(d * .48, .002);
    if (distance > 9.) break;
  }
  float divider = 1. - smoothstep(0., .005, min(x / cell, 1. - x / cell));
  bg = mix(bg, vec3(.16, .21, .32), divider * .42);
  color = vec4(pow(bg, vec3(1. / 2.2)), 1.);
}`;

function compile(type, source) {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader));
  }
  return shader;
}

const program = gl.createProgram();
gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexSource));
gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentSource));
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  throw new Error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);
const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const position = gl.getAttribLocation(program, 'position');
gl.enableVertexAttribArray(position);
gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
const resolution = gl.getUniformLocation(program, 'resolution');
const clock = gl.getUniformLocation(program, 'time');

window.renderAt = seconds => {
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.uniform2f(resolution, canvas.width, canvas.height);
  gl.uniform1f(clock, seconds);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.finish();
};
window.renderAt(0);
</script>
</html>
